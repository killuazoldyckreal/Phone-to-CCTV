<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Camera</title>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:system-ui,sans-serif;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  video{width:100%;height:100%;object-fit:contain;background:#000;}
  #bar{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;
       gap:12px;padding:10px 14px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;}
  #status{flex:1;}
  button{background:#222;color:#fff;border:1px solid #555;border-radius:6px;
         padding:6px 12px;font-size:14px;cursor:pointer;}
  button:hover{background:#333;}
  #login{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;
         align-items:center;justify-content:center;background:#000;color:#fff;}
  #login input{padding:8px;border-radius:4px;border:1px solid #555;background:#111;color:#fff;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;}
  .live{background:#2ecc71;} .bad{background:#e74c3c;} .warn{background:#f1c40f;}

  .osd{position:absolute;color:#e8e8e8;font-family:'Courier New',monospace;
       font-size:30px;letter-spacing:.5px;text-shadow:1px 1px 2px #000,0 0 4px #000;
       pointer-events:none;z-index:5;}
  #osdTL{top:14px;left:16px;font-weight:bold;}
  #osdTR{top:14px;right:16px;text-align:right;}
  #osdBL{bottom:52px;left:16px;font-size:13px;opacity:.9;}
  #osdBR{bottom:52px;right:16px;text-align:right;}
  #rec{color:#ff3b30;font-weight:bold;}
  #recDot{width:9px;height:9px;border-radius:50%;background:#ff3b30;
          display:inline-block;margin-right:5px;margin-bottom:5px;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.15;}}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>

  <div id="osdTL" class="osd" style="display:none">CAM 01</div>
  <div id="osdTR" class="osd" style="display:none"><span id="osdDate"></span><br><span id="osdTime"></span></div>
  <div id="osdBL" class="osd" style="display:none"><span id="osdMode"></span></div>
  <div id="osdBR" class="osd" style="display:none"><span id="rec"><span id="recDot"></span>REC</span></div>

  <div id="bar" style="display:none">
    <span id="status"><span class="dot warn"></span>Connecting…</span>
    <button id="fsBtn">Fullscreen</button>
  </div>
  <div id="login">
    <h3>LAN Camera</h3>
    <input id="user" placeholder="username" autocomplete="username">
    <input id="pass" placeholder="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Connect</button>
  </div>
</div>

<!-- Optional HLS.js fallback for browsers without native HLS / WebRTC (e.g. some Smart TVs).
     Vendor it once with:  npm install hls.js  ->  copy node_modules/hls.js/dist/hls.min.js here
     If the file is missing, WebRTC-capable browsers still work fine without it. -->
<script src="./hls.min.js" onerror="window.__noHls=true"></script>

<script>
const HOST = location.hostname;         // assumes viewer page is served from the same phone
const PATH = "live";
const WHEP_URL = `http://${HOST}:8889/${PATH}/whep`;
const HLS_URL  = `http://${HOST}:8888/${PATH}/index.m3u8`;

const video = document.getElementById('video');
const bar = document.getElementById('bar');
const statusEl = document.getElementById('status');
const login = document.getElementById('login');

let authHeader = '';
let pc = null;
let retryTimer = null;

function setStatus(text, cls){
  statusEl.innerHTML = `<span class="dot ${cls}"></span>${text}`;
  document.getElementById('osdMode').textContent = text.toUpperCase();
}

document.getElementById('loginBtn').onclick = () => {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value;
  authHeader = 'Basic ' + btoa(`${u}:${p}`);
  login.style.display = 'none';
  bar.style.display = 'flex';
  ['osdTL','osdTR','osdBL','osdBR'].forEach(id => document.getElementById(id).style.display = 'block');
  startClock();
  connectWebRTC();
};

function startClock(){
  const dateEl = document.getElementById('osdDate');
  const timeEl = document.getElementById('osdTime');
  const tick = () => {
    const now = new Date();
    dateEl.textContent = now.toLocaleDateString('en-GB'); // DD/MM/YYYY
    timeEl.textContent = now.toLocaleTimeString('en-GB', { hour12: false }); // HH:MM:SS
  };
  tick();
  setInterval(tick, 1000);
}

document.getElementById('fsBtn').onclick = () => {
  if (video.requestFullscreen) video.requestFullscreen();
};

async function connectWebRTC(){
  cleanupPeer();
  setStatus('Connecting (WebRTC)…', 'warn');

  pc = new RTCPeerConnection();
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });

  pc.ontrack = (e) => { video.srcObject = e.streams[0]; };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      setStatus('Live (WebRTC)', 'live');
    } else if (['failed','disconnected','closed'].includes(pc.connectionState)) {
      setStatus('Reconnecting…', 'bad');
      scheduleRetry();
    }
  };

  try {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIceGathering(pc);

    const resp = await fetchWithTimeout(WHEP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp', 'Authorization': authHeader },
      body: pc.localDescription.sdp,
    }, 5000);

    if (!resp.ok) throw new Error('WHEP rejected: ' + resp.status);
    const answerSdp = await resp.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  } catch (err) {
    console.warn('WebRTC failed, falling back to HLS:', err);
    connectHls();
  }
}

function waitForIceGathering(pc){
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const check = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 3000); // don't wait forever on flaky LANs
  });
}

function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
}

function connectHls(){
  cleanupPeer();
  setStatus('Connecting (HLS)…', 'warn');

  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari / iOS native HLS
    video.src = HLS_URL;
    video.play().catch(()=>{});
    setStatus('Live (HLS)', 'live');
    video.onerror = () => { setStatus('Reconnecting…', 'bad'); scheduleRetry(); };
    return;
  }

  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({
      xhrSetup: (xhr) => xhr.setRequestHeader('Authorization', authHeader),
      lowLatencyMode: true,
    });
    hls.loadSource(HLS_URL);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); setStatus('Live (HLS)', 'live'); });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) { setStatus('Reconnecting…', 'bad'); scheduleRetry(); }
    });
  } else {
    setStatus('No playback method available in this browser', 'bad');
  }
}

function cleanupPeer(){
  if (pc) { pc.close(); pc = null; }
}

function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connectWebRTC, 3000);
}
</script>
</body>
</html>
