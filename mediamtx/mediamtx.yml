###############################################################################
# MediaMTX configuration
#
# SECURITY WARNING:
#
# This project is intended for use on a trusted private LAN only.
#
# Do NOT expose RTSP, HLS, WebRTC, or the viewer server directly to the
# public internet.
#
# Authentication credentials must be changed before using the project on a LAN.
###############################################################################

logLevel: info

# --- API ---------------------------------------------------------------------
# Disabled because the current project does not use the MediaMTX API.
# This avoids exposing an unnecessary management endpoint.
api: no

# --- RTSP --------------------------------------------------------------------
# Local ingest port used by bridge.sh.
rtsp: yes
rtspAddress: :8554

# TCP only avoids UDP packet loss on unstable Wi-Fi.
protocols: [tcp]

rtmp: no
srt: no

# --- HLS ---------------------------------------------------------------------
# Fallback for browsers/devices where WebRTC is unavailable.
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 0.5s
hlsPartDuration: 200ms

# The viewer may be accessed from devices on the same LAN.
hlsAllowOrigin: '*'

# --- WebRTC ------------------------------------------------------------------
# Primary low-latency streaming method.
webrtc: yes
webrtcAddress: :8889

# Encryption is disabled for simple private-LAN usage.
#
# Do NOT expose this service directly to the public internet while encryption
# is disabled.
webrtcEncryption: no

webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189

# Automatically advertise the phone's current LAN IP.
webrtcIPsFromInterfaces: yes

# --- Authentication ----------------------------------------------------------
# CHANGE BOTH PASSWORDS BEFORE USING ON YOUR LAN.
#
# Basic authentication over plain HTTP is suitable only for trusted private
# networks. It should not be treated as secure for public internet exposure.
authInternalUsers:
  - user: publisher
    pass: PUB_CHANGE_ME
    permissions:
      - action: publish
        path: live

  - user: viewer
    pass: VIEW_CHANGE_ME
    permissions:
      - action: read
        path: live
      - action: playback
        path: live

  # Default deny.
  - user: any
    permissions: []

# --- Paths -------------------------------------------------------------------
paths:
  live:
    source: publisher
    sourceOnDemand: no
