###############################################################################
# MediaMTX config for the Redmi Note 6 Pro LAN camera relay.
# Run: ./mediamtx mediamtx.yml
###############################################################################

logLevel: info

# --- API (used for viewer count / status, LAN only, no auth by default) ----
api: yes
apiAddress: :9997

# --- RTSP: local ingest port for the ffmpeg bridge --------------------------
rtsp: yes
rtspAddress: :8554
protocols: [tcp]          # tcp only avoids UDP packet loss on flaky Wi-Fi

rtmp: no
srt: no

# --- HLS: fallback for Smart TVs / browsers without WebRTC ------------------
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency     # LL-HLS, ~1-2s latency instead of ~6-10s
hlsSegmentCount: 7
hlsSegmentDuration: 0.5s
hlsPartDuration: 200ms
hlsAllowOrigin: '*'

# --- WebRTC: primary low-latency path for PC/phone/tablet browsers ---------
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes   # advertise the phone's LAN IP automatically

# --- Auth --------------------------------------------------------------------
# CHANGE both passwords before exposing this on your LAN.
authInternalUsers:
  - user: publisher
    pass: PUB_CHANGE_ME
    permissions:
      - action: publish
        path: live

  - user: viewer
    pass: VIEW_CHANGE_ME
    permissions:
      - action: read
        path: live
      - action: playback
        path: live

  - user: any            # deny anonymous access entirely (default-deny)
    permissions: []

# --- Paths --------------------------------------------------------------------
paths:
  live:
    source: publisher      # only accepts a push from the ffmpeg bridge
    sourceOnDemand: no      # keep the path always active, not only when a viewer connects
